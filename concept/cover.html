The cover page of the PHT: the logo, the type of the work, the title and the subtitle, the author, the degree, the
supervisor, the student ID, the programme and the date, from the fields of the front matter.
-->
<section class="pht-cover">
  <div class="pht-logo"><img src="images/pht-logo.png" alt="Pädagogische Hochschule Tirol"></div>
  {{#type}}<p class="pht-type">{{type}}</p>{{/type}}
  <div class="pht-title-block">
    <p class="pht-title">{{title}}</p>
    <div class="pht-title-rule"></div>
    {{#subtitle}}<p class="pht-subtitle">{{subtitle}}</p>{{/subtitle}}
  </div>
  <p class="pht-label">Verfasser:in</p>
  <p class="pht-author">{{author}}</p>
  <p class="pht-label">angestrebter akademischer Grad</p>
  <p class="pht-degree">{{grad}}</p>
  <table class="pht-meta">
    <tr><td class="pht-key">Betreuer:in:</td><td>{{betreuerin}}</td></tr>
    <tr><td class="pht-key">Matrikelnummer:</td><td>{{matrikelnummer}}</td></tr>
    <tr><td class="pht-key">Studium:</td><td>{{studium}}</td></tr>
  </table>
  <p class="pht-date">{{date}}</p>
</section>
